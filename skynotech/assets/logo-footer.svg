  <text x="53" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#00B8D4" letter-spacing="3.2">PROJECT LABS</text>
